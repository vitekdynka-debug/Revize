# Deploys the QR spike (apps/spike-qr) to GitHub Pages so it can be tested on a real iPad over HTTPS.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy QR spike to Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/spike-qr/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages-spike.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spike:build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/spike-qr/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
